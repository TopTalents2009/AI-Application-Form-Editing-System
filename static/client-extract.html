<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>客户端年龄改写 · 申报书智能修改系统</title>
<link rel="stylesheet" href="/public/style.css?v=ce3">
<style>
.hint { font-size:13px; color:var(--sub); line-height:1.6; margin:0 0 16px; }
.mono-path { font-family:Consolas,monospace; font-size:12px; background:#f4f7fb; padding:8px 10px; border-radius:8px; word-break:break-all; }
.btn-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:16px 0; }
button.primary { border:0; background:linear-gradient(180deg,#3b74d6,#2450a4); color:#fff; padding:10px 18px; border-radius:10px; font-size:14px; cursor:pointer; }
button.primary:disabled { opacity:.55; cursor:not-allowed; }
button.ghost { border:1px solid #c5d0e0; background:#fff; padding:8px 14px; border-radius:10px; cursor:pointer; }
#log { white-space:pre-wrap; font-size:12px; color:var(--sub); }
#planEditor { margin-top: 8px; }
</style>
</head>
<body>
<header class="hero">
  <div class="wrap hero-in">
    <div class="logo"></div>
    <div class="titles">
      <h1>客户端年龄改写</h1>
      <p>流程与申报书修改一致：扫描出计划 → 人工核对修改前/后 → 确认后生成输入文件夹中的新申报书</p>
    </div>
    <a class="nav-extra" href="/" target="_blank" rel="noopener">返回申报书修改 ↗</a>
    <div class="live"><span class="dot"></span><span>独立页面</span></div>
  </div>
</header>
<main class="wrap">
  <section class="card">
    <h2>待提取目录</h2>
    <p class="hint">把带客户端（RCZX2026.exe）和申报书 Word 的材料文件夹放进下面目录，再点「生成编辑计划」。此步只读扫描，不会改文件。确认后会在原申报书旁生成「原文件名_修改后.docx」。1987-01-01 以前出生才会出现改写行。</p>
    <div class="mono-path" id="inbox">读取中…</div>
    <div class="hint" id="folderInfo"></div>
    <div class="btn-row">
      <button class="primary" id="runBtn">生成编辑计划</button>
      <span id="formErr" class="err"></span>
    </div>
    <div id="log"></div>
  </section>
  <section class="card">
    <h2>编辑计划（待人工确认）</h2>
    <div id="planEditor"><div class="empty">尚未生成计划</div></div>
  </section>
</main>
<script>
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
}
function escHtml(s) { return esc(s); }
function fitTa(el) {
  if (!el) return;
  el.style.height = "0";
  el.style.height = Math.max(el.scrollHeight, 42) + "px";
}
function fitPlanFields(root) {
  if (!root) return;
  var list = root.querySelectorAll(".ta-find,.ta-rep,.ta-op,.ta-clause");
  for (var i = 0; i < list.length; i++) fitTa(list[i]);
}
function buildRow(e, oi) {
  var tr = document.createElement("tr");
  tr.setAttribute("data-oi", oi);
  tr.innerHTML =
    "<td><input type=\"checkbox\" checked></td>" +
    "<td><span class=\"pno\">" + esc(e.appNo || "—") + "</span></td>" +
    "<td><span class=\"tag\">" + esc(e.section || e._sec || "其他") + "</span></td>" +
    "<td><textarea class=\"ta-clause\" rows=\"1\">" + escHtml(e.clause || "") + "</textarea></td>" +
    "<td><textarea class=\"ta-find\" rows=\"1\" readonly>" + escHtml(e.find || "") + "</textarea></td>" +
    "<td><textarea class=\"ta-op\" rows=\"1\">" + escHtml(e.opinion || e.clause || "") + "</textarea></td>" +
    "<td><textarea class=\"ta-rep\" rows=\"1\">" + escHtml(e.replace || "") + "</textarea></td>" +
    "<td><button class=\"delbtn\" type=\"button\"></button></td>";
  tr.querySelector(".delbtn").onclick = function () { tr.parentNode.removeChild(tr); };
  return tr;
}

var curPlanData = [];

function buildPlanEditor(plan) {
  var el = document.getElementById("planEditor");
  curPlanData = (plan.edits || []).map(function (e) {
    return Object.assign({}, e, {
      section: e._sec || e.section || "其他",
      opinion: e.opinion || e.clause || ""
    });
  });
  var rows = plan.rows || [];
  var skipN = rows.filter(function (r) { return r.patch_skip && !(r.edits && r.edits.length); }).length;
  var h = "<div class=\"pnote\">已扫描 <b>" + rows.length + "</b> 个客户端，生成 <b>" + curPlanData.length +
    "</b> 条编辑" + (skipN ? "（另有 " + skipN + " 个无需改写）" : "") +
    "。<b>修改前</b>为定位用原文（只读），<b>修改后</b>可改写；取消勾选＝放弃该条。全部确认后点击下方按钮，会在输入文件夹里的申报书旁生成「原文件名_修改后.docx」，不改客户端库。</div>";
  h += "<div class=\"ptable-wrap\"><table class=\"ptable\"><thead><tr>" +
    "<th style=\"width:34px\">用</th><th style=\"width:120px\">编号</th><th style=\"width:88px\">章节</th>" +
    "<th>意见条款</th><th style=\"width:18%\">修改前（定位用，勿改）</th>" +
    "<th style=\"width:22%\">修改意见</th><th style=\"width:24%\">修改后（可编辑）</th><th style=\"width:36px\"></th>" +
    "</tr></thead><tbody id=\"planRows\"></tbody></table></div>";
  h += "<h3><span class=\"ic\"></span>遗留事项（每行一条，可编辑）</h3><textarea id=\"loTa\" class=\"lo-ta\"></textarea>";
  h += "<div class=\"actions\"><button id=\"applyBtn\" class=\"primary\"> 确认无误，生成新申报书</button>" +
    "<button id=\"replanBtn\" class=\"ghost\"> 重新生成计划</button><span id=\"planErr\" class=\"err\"></span></div>";
  el.innerHTML = h;
  var tb = el.querySelector("#planRows");
  curPlanData.forEach(function (e, i) { tb.appendChild(buildRow(e, i)); });
  el.querySelector("#loTa").value = (plan.leftovers || []).join("\n");
  el.oninput = function (ev) {
    if (ev.target && ev.target.matches && ev.target.matches(".ta-find,.ta-rep,.ta-op,.ta-clause")) fitTa(ev.target);
  };
  requestAnimationFrame(function () { fitPlanFields(tb); });

  el.querySelector("#replanBtn").onclick = function () {
    if (!confirm("重新生成将丢弃当前所有人工修改，确定？")) return;
    document.getElementById("runBtn").click();
  };
  el.querySelector("#applyBtn").onclick = function () {
    var errEl = el.querySelector("#planErr"); errEl.textContent = "";
    var out = [], miss = [];
    Array.prototype.slice.call(tb.querySelectorAll("tr")).forEach(function (tr) {
      var oi = parseInt(tr.getAttribute("data-oi"), 10);
      var cb = tr.querySelector("input[type=checkbox]");
      if (!cb.checked) return;
      var taF = tr.querySelector(".ta-find"), taR = tr.querySelector(".ta-rep");
      var taO = tr.querySelector(".ta-op"), taC = tr.querySelector(".ta-clause");
      if (!taF.value.trim()) { miss.push("#" + (oi + 1)); return; }
      var src = curPlanData[oi] || {};
      out.push({
        find: taF.value, replace: taR.value,
        clause: (taC && taC.value) || src.clause || "",
        opinion: (taO && taO.value) || src.opinion || "",
        _sec: src.section || "其他",
        section: src.section || "其他",
        appNo: src.appNo || "",
        client: src.client || "",
        folder: src.folder || "",
        table: src.table || "",
        id: src.id,
        fields: src.fields || {}
      });
    });
    if (miss.length) { errEl.textContent = "以下行缺少锚点：" + miss.join("、"); return; }
    var lo = document.getElementById("loTa").value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
    if (!out.length && !lo.length) { errEl.textContent = "没有任何要应用的编辑或遗留事项"; return; }
    var btn = this;
    btn.disabled = true; btn.textContent = "正在生成新申报书…";
    fetch("/api/client-extract/apply", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ edits: out, leftovers: lo })
    }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.detail || r.statusText); return j; }); })
      .then(function (j) {
        var lines = [];
        (j.applied || []).forEach(function (a) {
          if (a.error) lines.push((a.folder || "") + "：" + a.error);
          (a.outputs || []).forEach(function (o) {
            lines.push((o.out || "") + "  命中 " + (o.hits || 0) + " / 未命中 " + (o.misses || 0));
          });
        });
        document.getElementById("log").textContent =
          "已生成 " + lines.length + " 份修改后的申报书。\n" + lines.join("\n");
        el.innerHTML = "<div class=\"empty\">已在输入文件夹中写出新申报书。可再次点「生成编辑计划」复核。</div>";
      })
      .catch(function (e2) { errEl.textContent = e2.message || String(e2); })
      .finally(function () {
        if (!btn || !document.body.contains(btn)) return;
        btn.disabled = false;
        btn.textContent = " 确认无误，生成新申报书";
      });
  };
}

async function loadStatus() {
  const r = await fetch("/api/client-extract/status");
  const j = await r.json();
  document.getElementById("inbox").textContent = j.inbox;
  document.getElementById("folderInfo").textContent =
    "已发现 " + j.folderCount + " 个文件夹。计龄截止 " + j.targetYear + "-12-31，改写门槛出生早于 " + j.cutoff + "。";
  if (j.plan && j.plan.edits) buildPlanEditor(j.plan);
}
document.getElementById("runBtn").onclick = async function () {
  const btn = this;
  const err = document.getElementById("formErr");
  err.textContent = "";
  btn.disabled = true;
  document.getElementById("log").textContent = "正在扫描客户端与申报书（只读，不改文件）…";
  try {
    const r = await fetch("/api/client-extract/plan", { method: "POST" });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    document.getElementById("log").textContent = "计划已生成：" + (j.editCount || 0) + " 条编辑，待确认。";
    buildPlanEditor(j.plan);
  } catch (e) {
    err.textContent = e.message || String(e);
    document.getElementById("log").textContent = "";
  } finally {
    btn.disabled = false;
  }
};
loadStatus().catch(e => { document.getElementById("inbox").textContent = e.message; });
</script>
</body>
</html>
